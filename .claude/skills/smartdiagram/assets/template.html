<title>__TITLE__</title>
<style>
  :root {
    --bg: #F4F5F2; --panel: #FFFFFF; --ink: #1B222B; --muted: #5A6472;
    --line: #C9CFD6; --chipbg: #EAEDE8; --dim: 0.14;
    --c1: #35855C; --c2: #2E77C9; --c3: #B26E22; --c4: #7A6BC9; --c5: #3E8F8F;
    --broken: #C94A4A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1216; --panel: #1A2026; --ink: #E8ECF1; --muted: #93A0AE;
      --line: #2C333C; --chipbg: #232A32;
      --c1: #5FBF8C; --c2: #5FA3EF; --c3: #E3A25B; --c4: #9D8FE8; --c5: #5FBFBF;
      --broken: #E36A6A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1216; --panel: #1A2026; --ink: #E8ECF1; --muted: #93A0AE;
    --line: #2C333C; --chipbg: #232A32;
    --c1: #5FBF8C; --c2: #5FA3EF; --c3: #E3A25B; --c4: #9D8FE8; --c5: #5FBFBF;
    --broken: #E36A6A;
  }
  :root[data-theme="light"] {
    --bg: #F4F5F2; --panel: #FFFFFF; --ink: #1B222B; --muted: #5A6472;
    --line: #C9CFD6; --chipbg: #EAEDE8;
    --c1: #35855C; --c2: #2E77C9; --c3: #B26E22; --c4: #7A6BC9; --c5: #3E8F8F;
    --broken: #C94A4A;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 1520px; margin: 0 auto; padding: 20px 24px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 6px; }
  h1 { font-family: "Bahnschrift", "Arial Narrow", "Segoe UI", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.02em; margin: 0; }
  h1 .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 22px; color: var(--c2); }
  .sub { color: var(--muted); font-size: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 12.5px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    background: var(--chipbg); border-radius: 3px; padding: 4px 10px;
  }
  .chip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .tab {
    font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 13.5px; letter-spacing: 0.05em;
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .tab:hover { border-color: var(--muted); }
  .tab:focus-visible { outline: 2px solid var(--c2); outline-offset: 1px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; padding: 6px 2px; }
  svg { display: block; min-width: 1100px; width: 100%; height: auto; }

  .node rect { fill: var(--bg); stroke-width: 1.4; cursor: pointer; }
  .node text { pointer-events: none; }
  .node .t { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 14.5px; font-weight: 600; fill: var(--ink); }
  .node .s { font-family: "Cascadia Code", Consolas, monospace; font-size: 10.5px; fill: var(--muted); }
  .node:focus { outline: none; }
  .node:focus rect, .node:hover rect { stroke-width: 2.4; }
  .node.selected rect { stroke-width: 2.6; }

  .colhead { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; }
  .colsub { font-family: "Cascadia Code", Consolas, monospace; font-size: 10px; fill: var(--muted); }
  .container-box { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
  .container-label { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; fill: var(--muted); }

  .edge { fill: none; stroke-width: 1.7; }
  .edge.ret { stroke-dasharray: 5 4; }
  .edge.broken { stroke-dasharray: 3 4; stroke-width: 2.1; }
  .elbl {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 10.5px; fill: var(--muted);
    paint-order: stroke; stroke: var(--panel); stroke-width: 3px;
  }
  .badge { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 10px; letter-spacing: 0.08em; }

  .dimmed { opacity: var(--dim); }
  @media (prefers-reduced-motion: no-preference) {
    .edge, .node rect, .node text, .elbl { transition: opacity 0.25s ease, stroke-width 0.15s ease; }
  }

  .info { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 900px) { .info { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px; }
  .card h2 {
    font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .card p { margin: 0 0 8px; max-width: 70ch; }
  .card p:last-child { margin-bottom: 0; }
  .card code { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; color: var(--c2); }
  #inspect .hint { color: var(--muted); font-style: italic; }
  #inspect h3 { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 16px; margin: 0 0 6px; }

  footer { margin-top: 16px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 22px; }
  footer b { color: var(--ink); font-weight: 600; }
  .ok { color: var(--c1); font-weight: 600; }
  .bad { color: var(--broken); font-weight: 600; }
</style>

<div class="wrap">
  <header>
    <h1><span class="mono" id="ttl-main"></span> <span id="ttl-suffix"></span></h1>
    <span class="sub" id="ttl-sub"></span>
  </header>
  <div class="legend" id="legend"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Flow selector"></div>
  <div class="stage"><svg id="d" role="img" aria-label="System wiring diagram"></svg></div>
  <div class="info">
    <div class="card"><h2 id="flowtitle"></h2><div id="flowtext"></div></div>
    <div class="card" id="inspect"><h2>Inspect</h2><div class="hint">Click any box to see its contract and invariants.</div></div>
  </div>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  const SPEC = /*__SPEC__*/null;
  if (!SPEC) { document.body.textContent = "wiring spec missing"; return; }

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("d");
  const slotVar = s => s === "broken" ? "var(--broken)" : `var(--c${s})`;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e); return e;
  };
  const hel = (tag, cls, parent) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    parent.appendChild(e); return e;
  };

  // ---- header / legend / footer ----
  document.getElementById("ttl-main").textContent = SPEC.title;
  document.getElementById("ttl-suffix").textContent = SPEC.titleSuffix || "";
  document.getElementById("ttl-sub").textContent = SPEC.subtitle || "";
  document.title = SPEC.title + (SPEC.titleSuffix ? " — " + SPEC.titleSuffix : "");

  const legend = document.getElementById("legend");
  SPEC.columns.forEach(c => {
    const chip = hel("span", "chip", legend);
    const i = hel("i", "", chip); i.style.background = slotVar(c.slot);
    chip.appendChild(document.createTextNode(" " + c.legend));
  });
  (SPEC.legendExtra || []).forEach(x => {
    const chip = hel("span", "chip", legend);
    const i = hel("i", "", chip); i.style.background = slotVar(x.slot);
    chip.appendChild(document.createTextNode(" " + x.label));
  });

  const foot = document.getElementById("foot");
  (SPEC.footer || []).forEach(f => {
    const s = hel("span", "", foot);
    const b = hel("b", "", s); b.textContent = f.label + " ";
    const v = hel("span", f.tone === "ok" ? "ok" : f.tone === "bad" ? "bad" : "", s);
    v.textContent = f.value;
  });

  // ---- layout: columns of stacked nodes, groups boxed ----
  const COLW = 312, CGAP = 72, MX = 40, Y0 = 112, VGAP = 16, BASE_H = 56, BADGE_H = 18;
  const ncols = SPEC.columns.length;
  const W = MX * 2 + ncols * COLW + (ncols - 1) * CGAP;
  const colX = i => MX + i * (COLW + CGAP);

  const byId = {};
  const colStacks = SPEC.columns.map(() => []);
  SPEC.nodes.forEach(n => { byId[n.id] = n; colStacks[n.col].push(n); });

  const groupBoxes = [];
  let maxY = 0;
  colStacks.forEach((stack, ci) => {
    let y = Y0, curGroup = null, gStart = 0;
    stack.forEach((n, idx) => {
      const g = n.group || null;
      if (g !== curGroup) {
        if (curGroup) { groupBoxes.push({ col: ci, label: curGroup, y0: gStart, y1: y - VGAP + 8 }); y += 10; }
        if (g) { y += 30; gStart = y - 22; }
        curGroup = g;
      }
      n._x = colX(ci) + (g ? 14 : 0);
      n._w = COLW - (g ? 28 : 0);
      n._h = BASE_H + (n.badge ? BADGE_H : 0);
      n._y = y;
      y += n._h + VGAP;
    });
    if (curGroup) groupBoxes.push({ col: ci, label: curGroup, y0: gStart, y1: y - VGAP + 8 });
    maxY = Math.max(maxY, y);
  });
  const H = maxY + 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // ---- defs: arrow markers ----
  const defs = el("defs", {});
  const usedSlots = new Set(SPEC.columns.map(c => String(c.slot))); usedSlots.add("broken");
  usedSlots.forEach(s => {
    const m = el("marker", { id: "m-" + s, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: slotVar(s) }, m);
  });

  // ---- column headers ----
  SPEC.columns.forEach((c, i) => {
    const x = colX(i);
    const t = el("text", { x, y: 60, class: "colhead", fill: slotVar(c.slot) }); t.textContent = c.title;
    const s = el("text", { x, y: 78, class: "colsub" }); s.textContent = c.sub || "";
    el("line", { x1: x, y1: 88, x2: x + COLW, y2: 88, stroke: slotVar(c.slot), "stroke-width": 2 });
  });

  // ---- group boxes ----
  groupBoxes.forEach(g => {
    el("rect", { x: colX(g.col) + 2, y: g.y0, width: COLW - 4, height: g.y1 - g.y0, rx: 6, class: "container-box" });
    const t = el("text", { x: colX(g.col) + 12, y: g.y0 + 16, class: "container-label" });
    t.textContent = g.label;
  });

  // ---- edges ----
  function anchor(a, b) {
    if (b._x >= a._x + a._w - 4) return { sx: a._x + a._w, sy: a._y + a._h / 2, tx: b._x, ty: b._y + b._h / 2 };
    if (b._x + b._w <= a._x + 4) return { sx: a._x, sy: a._y + a._h / 2, tx: b._x + b._w, ty: b._y + b._h / 2 };
    const acx = a._x + a._w / 2, bcx = b._x + b._w / 2;
    if (b._y > a._y) return { sx: acx - a._w / 4, sy: a._y + a._h, tx: bcx - b._w / 4, ty: b._y, vert: true };
    return { sx: acx - a._w / 4, sy: a._y, tx: bcx - b._w / 4, ty: b._y + b._h, vert: true };
  }
  const edgeEls = {}, lblEls = {};
  SPEC.edges.forEach(ed => {
    ed._key = ed.from + ">" + ed.to;
    const a = byId[ed.from], b = byId[ed.to];
    const { sx, sy, tx, ty, vert } = anchor(a, b);
    let d;
    if (vert) {
      d = `M ${sx} ${sy} C ${sx - 34} ${sy + (ty > sy ? 18 : -18)}, ${tx - 34} ${ty - (ty > sy ? 18 : -18)}, ${tx} ${ty}`;
    } else {
      const dx = Math.max(46, Math.min(120, Math.abs(tx - sx) / 2)) * (tx > sx ? 1 : -1);
      d = `M ${sx} ${sy} C ${sx + dx} ${sy}, ${tx - dx} ${ty}, ${tx} ${ty}`;
    }
    const slot = ed.broken ? "broken" : String(SPEC.columns[a.col].slot);
    const p = el("path", {
      d, class: "edge" + (ed.ret ? " ret" : "") + (ed.broken ? " broken" : ""),
      stroke: slotVar(slot), "marker-end": `url(#m-${slot})`
    });
    edgeEls[ed._key] = p;
    if (ed.label) {
      const t = el("text", { x: (sx + tx) / 2, y: (sy + ty) / 2 - 7, class: "elbl", "text-anchor": "middle" });
      t.textContent = ed.label;
      t.style.display = "none";
      lblEls[ed._key] = t;
    }
  });

  // ---- nodes ----
  const nodeEls = {};
  SPEC.nodes.forEach(n => {
    const slot = SPEC.columns[n.col].slot;
    const g = el("g", { class: "node", tabindex: 0, role: "button", "aria-label": n.title });
    el("rect", { x: n._x, y: n._y, width: n._w, height: n._h, rx: 5, stroke: slotVar(slot) }, g);
    const t1 = el("text", { x: n._x + 12, y: n._y + 24, class: "t" }, g); t1.textContent = n.title;
    const t2 = el("text", { x: n._x + 12, y: n._y + 42, class: "s" }, g); t2.textContent = n.sub || "";
    if (n.badge) {
      const bt = el("text", { x: n._x + 12, y: n._y + 62, class: "badge", fill: "var(--broken)" }, g);
      bt.textContent = n.badge;
    }
    nodeEls[n.id] = g;
    const select = () => {
      document.querySelectorAll(".node.selected").forEach(x => x.classList.remove("selected"));
      g.classList.add("selected");
      const box = document.getElementById("inspect");
      box.innerHTML = "<h2>Inspect</h2>";
      const h3 = document.createElement("h3"); h3.style.color = slotVar(slot); h3.textContent = n.title; box.appendChild(h3);
      const sub = document.createElement("p");
      sub.style.cssText = "font-family:'Cascadia Code',Consolas,monospace;font-size:12px;color:var(--muted);margin-bottom:8px";
      sub.textContent = n.sub || ""; box.appendChild(sub);
      const p = document.createElement("p"); p.textContent = n.desc || ""; box.appendChild(p);
    };
    g.addEventListener("click", select);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } });
  });

  // ---- flows ----
  const tabs = document.getElementById("tabs");
  SPEC.flows.forEach(fl => {
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.flow = fl.id; b.setAttribute("aria-pressed", "false");
    b.textContent = fl.title;
    b.addEventListener("click", () => setFlow(fl.id));
    tabs.appendChild(b);
  });
  function setFlow(id) {
    const fl = SPEC.flows.find(f => f.id === id);
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.flow === id)));
    document.getElementById("flowtitle").textContent = fl.caption || fl.title;
    document.getElementById("flowtext").innerHTML = fl.html || "";
    const over = id === "over";
    SPEC.edges.forEach(ed => {
      const on = over || (fl.edges || []).includes(ed._key);
      edgeEls[ed._key].classList.toggle("dimmed", !on);
      if (lblEls[ed._key]) lblEls[ed._key].style.display = (!over && on) ? "" : "none";
    });
    SPEC.nodes.forEach(n => {
      const on = over || (fl.nodes || []).includes(n.id);
      nodeEls[n.id].classList.toggle("dimmed", !on);
    });
  }
  setFlow(SPEC.flows[0].id);
})();
</script>
